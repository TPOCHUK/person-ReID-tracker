<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Person ReID Tracker</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <h1>Person ReID Tracker</h1>

    <div id="screen">

        <div id="placeholder">
            Camera is stopped
        </div>

        <img
            id="video"
            alt="Camera stream"
        >

    </div>

    <div class="controls">

        <button id="start">
            START
        </button>

        <button id="stop">
            STOP
        </button>

    </div>

    <script src="/static/script.js"></script>

</body>

</html>
